services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jizhang
      POSTGRES_USER: jizhang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: ${JIZHANG_API_IMAGE:-ghcr.io/mortalnb/jizhang-api:v1.4.4-cloud}
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
