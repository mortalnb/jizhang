name: Build jizhang API image

on:
  push:
    branches: ['main', 'codex/**']
    paths:
      - 'server/**'
      - '.github/workflows/build-jizhang-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jizhang-api:${{ github.sha }}
          build-args: |
            APP_VERSION=0.2.0-rc.2
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jizhang-api:${{ github.sha }}-migrate
          build-args: |
            APP_VERSION=0.2.0-rc.2
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
